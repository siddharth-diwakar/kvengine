name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The hf_xet client stalls on some hosts; force the plain HTTP download path.
  # Same reason loader.py sets this at import time.
  HF_HUB_DISABLE_XET: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  # Pure-logic tests: allocator invariants, percentile maths, mask geometry.
  # No weights, no tokenizer, no network. Finishes in well under a second, so it
  # runs on every push and every Python version we care about.
  fast:
    name: fast tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      # The default PyPI torch wheel for Linux bundles CUDA (~2.5 GB). The CPU
      # index serves a ~200 MB wheel, which is all CI needs. requirements.txt
      # pins no version, so the later install sees torch as already satisfied
      # and leaves it alone -- one source of truth for dependencies.
      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Fast tests
        run: pytest -m fast

  # Everything, including the exact-match anchors that need real weights.
  full:
    name: full suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Qwen2.5-0.5B is ~1 GB and every slow test needs it. Only the 0.5B is
      # cached: the 3B target from phase 5 is benchmark-only, and phase 5's tests
      # deliberately use the small model as its own draft.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen2.5-0.5b-v1

      - name: Full suite
        run: pytest

      # The project ships two attention implementations -- PyTorch's fused SDPA
      # kernel and the spelled-out reference -- and the benchmark numbers are only
      # meaningful if they agree. Re-run just the equivalence anchors on the
      # unfused path rather than the whole suite twice. "sharing" is in the filter
      # because phase 6's anchor is also an output-identity claim: prefix sharing
      # must change nothing, on either attention path.
      - name: Exact-match anchors on unfused attention
        env:
          KVENGINE_EAGER_ATTN: "1"
        run: pytest -m slow -k "match or agree or sharing"
